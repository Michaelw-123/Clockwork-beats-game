<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clockwork Beats — Quod Erat Ludendum</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Times New Roman", Times, serif;
    }
    body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      color: #000000;
      font-size: 2rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .container {
      background: #ffffff;
      padding: 1.25rem;
      border: 2px solid #000000;
      border-radius: 0;
      box-shadow: 4px 4px 0px #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      max-width: 480px;
      width: 100%;
    }

    /* Mode Selector Header */
    .mode-switch {
      display: flex;
      width: 100%;
      background: #ffffff;
      border: 1px solid #000000;
      padding: 0.25rem;
      gap: 0.25rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid transparent;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .mode-btn.active {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    /* Level / Puzzle Display Card */
    .level-card {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 0.75rem 1rem;
      width: 100%;
      text-align: center;
    }
    .level-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }
    .level-title { font-weight: bold; color: #000000; font-size: 1.1rem; }
    .nav-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .nav-btn:hover { background: #e5e5e5; }
    .level-desc { font-size: 0.95rem; color: #000000; line-height: 1.3; }

    canvas {
      background: #ffffff;
      border: 1px solid #000000;
      width: 100%;
      height: auto;
      max-width: 380px;
      aspect-ratio: 1;
    }

    /* Victory Banner */
    .win-banner {
      display: none;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 0.75rem;
      width: 100%;
      text-align: center;
    }
    .win-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 0.5rem 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .win-btn:hover { background: #e5e5e5; }

    .stats {
      font-size: 0.95rem;
      color: #000000;
      text-align: center;
      border-top: 1px dashed #000000;
      border-bottom: 1px dashed #000000;
      padding: 0.35rem 0;
      width: 100%;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      width: 100%;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.9rem;
    }
    input[type="range"] { accent-color: #000000; }
    
    .btn {
      grid-column: span 2;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.05rem;
    }
    .btn:hover { background: #333333; }
  </style>
</head>
<body>

<div class="container">
  <h1>Clockwork Beats</h1>

  <!-- Mode Selector -->
  <div class="mode-switch">
    <button class="mode-btn active" id="btn-mode-puzzle">Puzzle Mode</button>
    <button class="mode-btn" id="btn-mode-free">Free Exploration</button>
  </div>

  <!-- Level Banner (Puzzle Mode Only) -->
  <div class="level-card" id="level-card">
    <div class="level-header">
      <button class="nav-btn" id="prev-level-btn">&#9668; Prev</button>
      <span class="level-title" id="level-title">Level 1</span>
      <button class="nav-btn" id="header-next-btn">Next &#9658;</button>
    </div>
    <div class="level-desc" id="level-desc">Loading...</div>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>
  
  <!-- In-Screen Victory Banner -->
  <div class="win-banner" id="win-banner">
    <div id="win-text">Harmony Achieved! Shape completed.</div>
    <button class="win-btn" id="banner-next-btn">Next Level &#10140;</button>
  </div>

  <div class="stats" id="stats">GCD(12, 1) = 1 | Coprime: YES</div>

  <div class="controls">
    <!-- Clock Size (N) - Visible in Free Exploration Mode -->
    <div class="control-group" id="n-group" style="display: none; grid-column: span 2;">
      <label>Clock Beats (N): <span id="n-val">12</span></label>
      <input type="range" id="n-slider" min="3" max="24" value="12">
    </div>

    <!-- Step Size (K) -->
    <div class="control-group" id="k-group">
      <label>Step Size (K): <span id="k-val">1</span></label>
      <input type="range" id="k-slider" min="1" max="11" value="1">
    </div>

    <!-- Tempo BPM -->
    <div class="control-group">
      <label>Tempo (BPM): <span id="bpm-val">140</span></label>
      <input type="range" id="bpm-slider" min="60" max="240" value="140">
    </div>

    <button class="btn" id="play-btn">Start Playback</button>
  </div>
</div>

<script>
  const levels = [
    {
      title: "Level 1: The Full Ring",
      N: 12,
      desc: "Find a step size K coprime to 12 that visits ALL 12 beats in a single closed loop!",
      targetNodes: 12,
      minK: 1
    },
    {
      title: "Level 2: The Triangle",
      N: 12,
      desc: "Find a step size K that completes a 3-beat closed loop (an equilateral triangle)!",
      targetNodes: 3,
      minK: 1
    },
    {
      title: "Level 3: The Square",
      N: 12,
      desc: "Find a step size K that completes a 4-beat closed loop (a square)!",
      targetNodes: 4,
      minK: 1
    },
    {
      title: "Level 4: The Hexagon",
      N: 12,
      desc: "Find a step size K that completes a closed 6-beat loop (a regular hexagon)!",
      targetNodes: 6,
      minK: 1
    },
    {
      title: "Level 5: The Regular Pentagon",
      N: 15,
      desc: "Clock size N = 15. Find a step size K that completes a closed 5-beat loop!",
      targetNodes: 5,
      minK: 1
    },
    {
      title: "Level 6: Prime 13-Star",
      N: 13,
      desc: "N = 13 is Prime! Find a step size K (> 1) that visits all 13 beats in a star loop.",
      targetNodes: 13,
      minK: 2
    },
    {
      title: "Level 7: The Octagon",
      N: 16,
      desc: "Clock size N = 16. Find a step size K that completes a closed 8-beat loop!",
      targetNodes: 8,
      minK: 1
    },
    {
      title: "Level 8: Prime 17-Star",
      N: 17,
      desc: "N = 17 is Prime! Find a step size K (> 1) that visits all 17 beats in a complete star loop.",
      targetNodes: 17,
      minK: 2
    },
    {
      title: "Level 9: The Nonagon",
      N: 18,
      desc: "Clock size N = 18. Find a step size K that visits exactly 9 beats in a closed loop!",
      targetNodes: 9,
      minK: 1
    },
    {
      title: "Level 10: Grand Clock 20-Star",
      N: 20,
      desc: "Final Challenge! Find a step size K (K ≥ 3) coprime to 20 to hit all 20 beats!",
      targetNodes: 20,
      minK: 3
    }
  ];

  let currentMode = 'puzzle';
  let currentLevelIdx = 0;
  
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  const btnModePuzzle = document.getElementById('btn-mode-puzzle');
  const btnModeFree = document.getElementById('btn-mode-free');
  
  const levelCard = document.getElementById('level-card');
  const levelTitle = document.getElementById('level-title');
  const levelDesc = document.getElementById('level-desc');
  const prevLevelBtn = document.getElementById('prev-level-btn');
  const headerNextBtn = document.getElementById('header-next-btn');
  
  const winBanner = document.getElementById('win-banner');
  const bannerNextBtn = document.getElementById('banner-next-btn');
  
  const nGroup = document.getElementById('n-group');
  const nSlider = document.getElementById('n-slider');
  const kSlider = document.getElementById('k-slider');
  const bpmSlider = document.getElementById('bpm-slider');
  const playBtn = document.getElementById('play-btn');

  let N = levels[0].N;
  let K = 1;
  let BPM = parseInt(bpmSlider.value);
  let currentPos = 0;
  let visitedEdges = new Set();
  let visitedNodes = new Set([0]);
  let isPlaying = false;
  let timer = null;
  let audioCtx = null;
  let levelCleared = false;

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

  function playSynth(nodeIndex) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const baseFreq = 220;
    const freq = baseFreq * Math.pow(2, nodeIndex / 12);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }

  function step() {
    const nextPos = (currentPos + K) % N;
    visitedEdges.add(`${currentPos}->${nextPos}`);
    currentPos = nextPos;
    visitedNodes.add(currentPos);
    
    if (audioCtx) playSynth(currentPos);
    draw();
    updateStats();

    if (currentPos === 0) {
      checkWinCondition();
    }
  }

  function checkWinCondition() {
    if (currentMode !== 'puzzle' || levelCleared) return;

    const lvl = levels[currentLevelIdx];
    const validK = K >= lvl.minK;

    if (visitedNodes.size === lvl.targetNodes && validK) {
      levelCleared = true;
      winBanner.style.display = 'block';
      if (currentLevelIdx >= levels.length - 1) {
        document.getElementById('win-text').innerText = "🏆 You completed all 10 levels!";
        bannerNextBtn.style.display = 'none';
      } else {
        document.getElementById('win-text').innerText = "Shape completed!";
        bannerNextBtn.style.display = 'inline-block';
      }
    }
  }

  function loadLevel(idx) {
    currentLevelIdx = idx;
    const lvl = levels[currentLevelIdx];
    N = lvl.N;
    
    levelTitle.innerText = lvl.title;
    levelDesc.innerText = lvl.desc;
    
    kSlider.max = N - 1;
    K = 1;
    kSlider.value = 1;
    document.getElementById('k-val').innerText = K;
    
    levelCleared = false;
    winBanner.style.display = 'none';
    reset();
    updateStats();
  }

  function switchMode(newMode) {
    currentMode = newMode;
    if (currentMode === 'puzzle') {
      btnModePuzzle.classList.add('active');
      btnModeFree.classList.remove('active');
      levelCard.style.display = 'block';
      nGroup.style.display = 'none';
      loadLevel(currentLevelIdx);
    } else {
      btnModeFree.classList.add('active');
      btnModePuzzle.classList.remove('active');
      levelCard.style.display = 'none';
      winBanner.style.display = 'none';
      nGroup.style.display = 'flex';
      
      N = parseInt(nSlider.value);
      kSlider.max = N - 1;
      if (K >= N) K = N - 1;
      kSlider.value = K;
      document.getElementById('k-val').innerText = K;
      reset();
      updateStats();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 140;

    const nodes = [];
    for (let i = 0; i < N; i++) {
      const angle = (i * 2 * Math.PI / N) - Math.PI / 2;
      nodes.push({
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      });
    }

    // Draw connecting lines
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;
    visitedEdges.forEach(edge => {
      const [from, to] = edge.split('->').map(Number);
      ctx.beginPath();
      ctx.moveTo(nodes[from].x, nodes[from].y);
      ctx.lineTo(nodes[to].x, nodes[to].y);
      ctx.stroke();
    });

    // Draw nodes
    nodes.forEach((node, i) => {
      ctx.beginPath();
      ctx.arc(node.x, node.y, 7, 0, Math.PI * 2);
      if (i === currentPos) {
        ctx.fillStyle = '#000000';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000000';
        ctx.stroke();
      } else if (visitedNodes.has(i)) {
        ctx.fillStyle = '#666666';
        ctx.fill();
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#000000';
        ctx.stroke();
      }
    });
  }

  function reset() {
    currentPos = 0;
    visitedEdges.clear();
    visitedNodes = new Set([0]);
    draw();
  }

  function updateStats() {
    const g = gcd(N, K);
    const coprime = g === 1 ? 'YES' : 'NO';
    document.getElementById('stats').innerText = `Clock (N): ${N} | GCD(${N}, ${K}) = ${g} | Visited: ${visitedNodes.size}/${N}`;
  }

  // Event Listeners
  btnModePuzzle.addEventListener('click', () => switchMode('puzzle'));
  btnModeFree.addEventListener('click', () => switchMode('free'));

  prevLevelBtn.addEventListener('click', () => {
    if (currentLevelIdx > 0) loadLevel(currentLevelIdx - 1);
  });
  headerNextBtn.addEventListener('click', () => {
    if (currentLevelIdx < levels.length - 1) loadLevel(currentLevelIdx + 1);
  });
  bannerNextBtn.addEventListener('click', () => {
    if (currentLevelIdx < levels.length - 1) loadLevel(currentLevelIdx + 1);
  });

  kSlider.addEventListener('input', (e) => {
    K = parseInt(e.target.value);
    document.getElementById('k-val').innerText = K;
    levelCleared = false;
    winBanner.style.display = 'none';
    reset();
    updateStats();
  });

  nSlider.addEventListener('input', (e) => {
    if (currentMode === 'free') {
      N = parseInt(e.target.value);
      document.getElementById('n-val').innerText = N;
      kSlider.max = N - 1;
      if (K >= N) { K = N - 1; kSlider.value = K; document.getElementById('k-val').innerText = K; }
      reset();
      updateStats();
    }
  });

  bpmSlider.addEventListener('input', (e) => {
    BPM = parseInt(e.target.value);
    document.getElementById('bpm-val').innerText = BPM;
    if (isPlaying) {
      clearInterval(timer);
      timer = setInterval(step, (60 / BPM) * 1000);
    }
  });

  playBtn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isPlaying = !isPlaying;
    playBtn.innerText = isPlaying ? 'Pause' : 'Start Playback';
    if (isPlaying) {
      timer = setInterval(step, (60 / BPM) * 1000);
    } else {
      clearInterval(timer);
    }
  });

  // Initialize
  switchMode('puzzle');
</script>
</body>
</html>
