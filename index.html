<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clockwork Beats — Quod Erat Ludendum</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    h1 { margin: 0 0 0.5rem 0; color: var(--accent); }
    .container {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 500px;
      width: 100%;
    }
    canvas {
      background: #090d16;
      border-radius: 0.5rem;
      width: 100%;
      height: auto;
      max-width: 400px;
      aspect-ratio: 1;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 100%;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.9rem;
    }
    input[type="range"] { accent-color: var(--accent); }
    .stats {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }
    .btn {
      grid-column: span 2;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">
  <h1>Clockwork Beats</h1>
  <canvas id="canvas" width="400" height="400"></canvas>
  
  <div class="stats" id="stats">GCD(12, 5) = 1 | Coprime: YES</div>

  <div class="controls">
    <div class="control-group">
      <label>Clock Beats (N): <span id="n-val">12</span></label>
      <input type="range" id="n-slider" min="3" max="24" value="12">
    </div>
    <div class="control-group">
      <label>Step Size (K): <span id="k-val">5</span></label>
      <input type="range" id="k-slider" min="1" max="11" value="5">
    </div>
    <div class="control-group" style="grid-column: span 2;">
      <label>Tempo (BPM): <span id="bpm-val">130</span></label>
      <input type="range" id="bpm-slider" min="60" max="240" value="130">
    </div>
    <button class="btn" id="play-btn">Start Playback</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const nSlider = document.getElementById('n-slider');
  const kSlider = document.getElementById('k-slider');
  const bpmSlider = document.getElementById('bpm-slider');
  const playBtn = document.getElementById('play-btn');

  let N = parseInt(nSlider.value);
  let K = parseInt(kSlider.value);
  let BPM = parseInt(bpmSlider.value);
  let currentPos = 0;
  let visitedEdges = new Set();
  let visitedNodes = new Set([0]);
  let isPlaying = false;
  let timer = null;
  let audioCtx = null;

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

  function playSynth(nodeIndex) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    // Scale frequency based on node position
    const baseFreq = 220;
    const freq = baseFreq * Math.pow(2, nodeIndex / 12);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }

 function step() {
  const nextPos = (currentPos + K) % N;
  visitedEdges.add(`${currentPos}->${nextPos}`);
  currentPos = nextPos;
  visitedNodes.add(currentPos);
  
  if (audioCtx) playSynth(currentPos);
  draw();
  updateStats();
}

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 150;

    // Node coordinates
    const nodes = [];
    for (let i = 0; i < N; i++) {
      const angle = (i * 2 * Math.PI / N) - Math.PI / 2;
      nodes.push({
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      });
    }

    // Draw lines
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    visitedEdges.forEach(edge => {
      const [from, to] = edge.split('->').map(Number);
      ctx.beginPath();
      ctx.moveTo(nodes[from].x, nodes[from].y);
      ctx.lineTo(nodes[to].x, nodes[to].y);
      ctx.stroke();
    });

    // Draw nodes
    nodes.forEach((node, i) => {
      ctx.beginPath();
      ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = i === currentPos ? '#f43f5e' : (visitedNodes.has(i) ? '#38bdf8' : '#334155');
      ctx.fill();
    });
  }

  function reset() {
    currentPos = 0;
    visitedEdges.clear();
    visitedNodes = new Set([0]);
    draw();
  }

  function updateStats() {
    const g = gcd(N, K);
    const coprime = g === 1 ? 'YES' : 'NO';
    document.getElementById('stats').innerText = `GCD(${N}, ${K}) = ${g} | Coprime: ${coprime} | Visited: ${visitedNodes.size}/${N}`;
  }

  nSlider.addEventListener('input', (e) => {
    N = parseInt(e.target.value);
    document.getElementById('n-val').innerText = N;
    kSlider.max = N - 1;
    if (K >= N) { K = N - 1; kSlider.value = K; document.getElementById('k-val').innerText = K; }
    reset();
    updateStats();
  });

  kSlider.addEventListener('input', (e) => {
    K = parseInt(e.target.value);
    document.getElementById('k-val').innerText = K;
    reset();
    updateStats();
  });

  bpmSlider.addEventListener('input', (e) => {
    BPM = parseInt(e.target.value);
    document.getElementById('bpm-val').innerText = BPM;
    if (isPlaying) {
      clearInterval(timer);
      timer = setInterval(step, (60 / BPM) * 1000);
    }
  });

  playBtn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isPlaying = !isPlaying;
    playBtn.innerText = isPlaying ? 'Pause' : 'Start Playback';
    if (isPlaying) {
      timer = setInterval(step, (60 / BPM) * 1000);
    } else {
      clearInterval(timer);
    }
  });

  updateStats();
  draw();
</script>
</body>
</html>
