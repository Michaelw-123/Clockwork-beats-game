<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clockwork Beats — Quod Erat Ludendum</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    h1 { margin: 0; color: var(--accent); font-size: 1.8rem; }
    .container {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 480px;
      width: 100%;
      box-sizing: border-box;
    }
    .mode-switch {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--text);
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: bold;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #000;
    }
    .level-card {
      background: #090d16;
      border: 1px solid var(--accent);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .level-title { font-weight: bold; color: var(--accent); margin-bottom: 0.25rem; }
    .level-desc { font-size: 0.88rem; color: var(--text); }
    canvas {
      background: #090d16;
      border-radius: 0.5rem;
      width: 100%;
      height: auto;
      max-width: 380px;
      aspect-ratio: 1;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 100%;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.85rem;
    }
    input[type="range"] { accent-color: var(--accent); }
    .stats {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    .btn {
      grid-column: span 2;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover { opacity: 0.9; }
    .win-banner {
      display: none;
      background: #064e3b;
      border: 1px solid var(--success);
      color: #f8fafc;
      padding: 0.75rem;
      border-radius: 0.5rem;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .next-btn {
      background: var(--success);
      color: #000;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Clockwork Beats</h1>

  <div class="mode-switch">
    <button class="mode-btn active" id="btn-puzzle">Puzzle Mode</button>
    <button class="mode-btn" id="btn-free">Free Exploration</button>
  </div>
  
  <div class="level-card" id="level-card">
    <div class="level-title" id="level-title">Level 1</div>
    <div class="level-desc" id="level-desc">Loading level...</div>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>
  
  <div class="win-banner" id="win-banner">
    <div id="win-text">🎉 Harmony Achieved! Target shape formed.</div>
    <button class="next-btn" id="next-level-btn">Next Level ➔</button>
  </div>

  <div class="stats" id="stats">GCD(12, 1) = 1 | Coprime: YES</div>

  <div class="controls">
    <div class="control-group" id="n-group" style="display: none;">
      <label>Clock Beats (N): <span id="n-val">12</span></label>
      <input type="range" id="n-slider" min="3" max="24" value="12">
    </div>
    <div class="control-group" id="k-group">
      <label>Step Size (K): <span id="k-val">1</span></label>
      <input type="range" id="k-slider" min="1" max="11" value="1">
    </div>
    <div class="control-group" id="bpm-group">
      <label>Tempo (BPM): <span id="bpm-val">140</span></label>
      <input type="range" id="bpm-slider" min="60" max="240" value="140">
    </div>
    <button class="btn" id="play-btn">Start Playback</button>
  </div>
</div>

<script>
  const levels = [
    {
      title: "Level 1: The Full Ring",
      N: 12,
      desc: "Find a step size K coprime to 12 that forms a star visiting ALL 12 beats in a single closed loop!",
      targetNodes: 12
    },
    {
      title: "Level 2: The Square",
      N: 12,
      desc: "Find a step size K that completes a closed 4-beat loop (a square)!",
      targetNodes: 4
    },
    {
      title: "Level 3: The Regular Pentagon",
      N: 15,
      desc: "Clock size N = 15. Find a step size K that completes a closed loop visiting exactly 5 beats!",
      targetNodes: 5
    },
    {
      title: "Level 4: Prime 17-Star",
      N: 17,
      desc: "N = 17 is Prime! Find a K (> 1) that visits all 17 beats in a complete loop.",
      targetNodes: 17,
      minK: 2
    }
  ];

  let mode = 'puzzle'; // 'puzzle' or 'free'
  let currentLevelIdx = 0;
  
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const nSlider = document.getElementById('n-slider');
  const kSlider = document.getElementById('k-slider');
  const bpmSlider = document.getElementById('bpm-slider');
  const playBtn = document.getElementById('play-btn');
  const winBanner = document.getElementById('win-banner');
  const nextLevelBtn = document.getElementById('next-level-btn');
  const btnPuzzle = document.getElementById('btn-puzzle');
  const btnFree = document.getElementById('btn-free');
  const levelCard = document.getElementById('level-card');
  const nGroup = document.getElementById('n-group');

  let N = levels[0].N;
  let K = 1;
  let BPM = parseInt(bpmSlider.value);
  let currentPos = 0;
  let visitedEdges = new Set();
  let visitedNodes = new Set([0]);
  let isPlaying = false;
  let timer = null;
  let audioCtx = null;
  let levelCleared = false;

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

  function playSynth(nodeIndex) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const baseFreq = 220;
    const freq = baseFreq * Math.pow(2, nodeIndex / 12);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }

  function step() {
    const nextPos = (currentPos + K) % N;
    visitedEdges.add(`${currentPos}->${nextPos}`);
    currentPos = nextPos;
    visitedNodes.add(currentPos);
    
    if (audioCtx) playSynth(currentPos);
    draw();
    updateStats();

    // Check win condition ONLY when a full loop closes back to start (0)
    if (currentPos === 0) {
      checkWinCondition();
    }
  }

  function checkWinCondition() {
    if (mode !== 'puzzle' || levelCleared) return;

    const currentLevel = levels[currentLevelIdx];
    const validK = !currentLevel.minK || K >= currentLevel.minK;

    if (visitedNodes.size === currentLevel.targetNodes && validK) {
      levelCleared = true;
      winBanner.style.display = 'block';
      if (currentLevelIdx >= levels.length - 1) {
        document.getElementById('win-text').innerText = "🏆 You completed all levels! Modular Arithmetic Mastered!";
        nextLevelBtn.style.display = 'none';
      } else {
        document.getElementById('win-text').innerText = "🎉 Harmony Achieved! Shape completed.";
        nextLevelBtn.style.display = 'inline-block';
      }
    }
  }

  function loadLevel(idx) {
    const lvl = levels[idx];
    N = lvl.N;
    document.getElementById('level-title').innerText = lvl.title;
    document.getElementById('level-desc').innerText = lvl.desc;
    
    kSlider.max = N - 1;
    K = 1;
    kSlider.value = 1;
    document.getElementById('k-val').innerText = K;
    
    levelCleared = false;
    winBanner.style.display = 'none';
    reset();
    updateStats();
  }

  function setMode(newMode) {
    mode = newMode;
    btnPuzzle.classList.toggle('active', mode === 'puzzle');
    btnFree.classList.toggle('active', mode === 'free');
    
    if (mode === 'free') {
      levelCard.style.display = 'none';
      winBanner.style.display = 'none';
      nGroup.style.display = 'flex';
      kGroupStyleForFree();
    } else {
      levelCard.style.display = 'block';
      nGroup.style.display = 'none';
      loadLevel(currentLevelIdx);
    }
  }

  function kGroupStyleForFree() {
    N = parseInt(nSlider.value);
    kSlider.max = N - 1;
    if (K >= N) K = N - 1;
    kSlider.value = K;
    document.getElementById('k-val').innerText = K;
    reset();
    updateStats();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 140;

    const nodes = [];
    for (let i = 0; i < N; i++) {
      const angle = (i * 2 * Math.PI / N) - Math.PI / 2;
      nodes.push({
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      });
    }

    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    visitedEdges.forEach(edge => {
      const [from, to] = edge.split('->').map(Number);
      ctx.beginPath();
      ctx.moveTo(nodes[from].x, nodes[from].y);
      ctx.lineTo(nodes[to].x, nodes[to].y);
      ctx.stroke();
    });

    nodes.forEach((node, i) => {
      ctx.beginPath();
      ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = i === currentPos ? '#f43f5e' : (visitedNodes.has(i) ? '#38bdf8' : '#334155');
      ctx.fill();
    });
  }

  function reset() {
    currentPos = 0;
    visitedEdges.clear();
    visitedNodes = new Set([0]);
    draw();
  }

  function updateStats() {
    const g = gcd(N, K);
    const coprime = g === 1 ? 'YES' : 'NO';
    document.getElementById('stats').innerText = `Clock (N): ${N} | GCD(${N}, ${K}) = ${g} | Visited: ${visitedNodes.size}/${N}`;
  }

  kSlider.addEventListener('input', (e) => {
    K = parseInt(e.target.value);
    document.getElementById('k-val').innerText = K;
    levelCleared = false;
    winBanner.style.display = 'none';
    reset();
    updateStats();
  });

  nSlider.addEventListener('input', (e) => {
    if (mode === 'free') {
      N = parseInt(e.target.value);
      document.getElementById('n-val').innerText = N;
      kGroupStyleForFree();
    }
  });

  bpmSlider.addEventListener('input', (e) => {
    BPM = parseInt(e.target.value);
    document.getElementById('bpm-val').innerText = BPM;
    if (isPlaying) {
      clearInterval(timer);
      timer = setInterval(step, (60 / BPM) * 1000);
    }
  });

  playBtn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isPlaying = !isPlaying;
    playBtn.innerText = isPlaying ? 'Pause' : 'Start Playback';
    if (isPlaying) {
      timer = setInterval(step, (60 / BPM) * 1000);
    } else {
      clearInterval(timer);
    }
  });

  nextLevelBtn.addEventListener('click', () => {
    if (currentLevelIdx < levels.length - 1) {
      currentLevelIdx++;
      loadLevel(currentLevelIdx);
    }
  });

  btnPuzzle.addEventListener('click', () => setMode('puzzle'));
  btnFree.addEventListener('click', () => setMode('free'));

  loadLevel(0);
</script>
</body>
</html>
